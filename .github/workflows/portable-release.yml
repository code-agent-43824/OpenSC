name: Portable PKCS11 tools release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: true
        default: 0.27.1-portable.4

permissions:
  contents: read

env:
  OPENSSL_VERSION: 3.5.7
  OPENSSL_SHA256: a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8

jobs:
  build-linux:
    name: Build Linux ${{ matrix.arch }} (glibc 2.31)
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf automake build-essential ca-certificates curl file libtool \
            make perl pkg-config unzip zip
      - uses: actions/checkout@v7
      - name: Build package
        env:
          PORTABLE_ARCH: ${{ matrix.arch }}
        run: scripts/portable/build-linux.sh
      - name: Prepare flat Actions artifact
        run: |
          mkdir -p artifact/opensc-portable-linux-${{ matrix.arch }}
          unzip -q dist/opensc-portable-linux-${{ matrix.arch }}.zip \
            -d artifact/opensc-portable-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: opensc-portable-linux-${{ matrix.arch }}
          path: artifact/opensc-portable-linux-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: rutoken-test-linux-${{ matrix.arch }}
          path: dist/rutoken-test-linux-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 90

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2025
            setenv: amd64_x86
          - arch: x64
            runner: windows-2025
            setenv: amd64
          - arch: arm64
            runner: windows-2025
            setenv: amd64_arm64
    runs-on: ${{ matrix.runner }}
    env:
      PORTABLE_ARCH: ${{ matrix.arch }}
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.arch }}-windows-static
    steps:
      - uses: actions/checkout@v7
      - name: Install CPDK
        run: choco install windows-cryptographic-provider-development-kit -y > $null
      - name: Cache vcpkg
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: portable-vcpkg-${{ matrix.arch }}-${{ hashFiles('win32/vcpkg.json', 'win32/ports/**') }}
      - name: Prepare vcpkg
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
        run: |
          $installed = "${{ github.workspace }}\vcpkg_installed"
          "VCPKG_INSTALLED=$installed" >> $env:GITHUB_ENV
          C:\vcpkg\vcpkg install `
            --x-manifest-root "${{ github.workspace }}\win32" `
            --x-install-root $installed
      - name: Build package
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & "$vsPath\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.setenv }} "&&" scripts\portable\build-windows.cmd
      - name: Prepare flat Actions artifact
        run: Expand-Archive -LiteralPath dist\opensc-portable-windows-${{ matrix.arch }}.zip -DestinationPath artifact\opensc-portable-windows-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: opensc-portable-windows-${{ matrix.arch }}
          path: artifact/opensc-portable-windows-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: rutoken-test-windows-${{ matrix.arch }}
          path: dist/rutoken-test-windows-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 90

  build-macos:
    name: Build macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: brew install autoconf automake libtool pkg-config
      - name: Build package
        run: scripts/portable/build-macos.sh
      - name: Prepare flat Actions artifact
        run: |
          mkdir -p artifact/opensc-portable-macos-universal
          unzip -q dist/opensc-portable-macos-universal.zip \
            -d artifact/opensc-portable-macos-universal
      - uses: actions/upload-artifact@v7
        with:
          name: opensc-portable-macos-universal
          path: artifact/opensc-portable-macos-universal/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: rutoken-test-macos-universal
          path: dist/rutoken-test-macos-universal/
          if-no-files-found: error
          retention-days: 90

  verify-linux:
    name: Verify Linux ${{ matrix.arch }} on a clean runner
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ubuntu:20.04
    steps:
      - name: Install test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl python3 unzip
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: opensc-portable-linux-${{ matrix.arch }}
          path: opensc-package
      - uses: actions/download-artifact@v8
        with:
          name: rutoken-test-linux-${{ matrix.arch }}
          path: rutoken-test
      - name: Download latest matching SoftHSM portable library
        run: |
          curl --fail --location --retry 5 \
            --output softhsm-portable-linux-${{ matrix.arch }}.zip \
            https://github.com/code-agent-43824/SoftHSMv2/releases/latest/download/softhsm-portable-linux-${{ matrix.arch }}.zip
          mkdir softhsm-package
          unzip -q softhsm-portable-linux-${{ matrix.arch }}.zip -d softhsm-package
      - name: Prepare and test downloadable test kit
        run: |
          mkdir -p artifact-testkit/opensc-package artifact-testkit/softhsm-package artifact-testkit/rutoken-test
          cp -a opensc-package/. artifact-testkit/opensc-package/
          cp -a softhsm-package/. artifact-testkit/softhsm-package/
          cp -a rutoken-test/. artifact-testkit/rutoken-test/
          cp scripts/portable/test.py artifact-testkit/test.py
          cp packaging/portable/TEST-KIT-README.txt artifact-testkit/README.txt
          printf '%s\n' 'linux-${{ matrix.arch }}' > artifact-testkit/platform.txt
          python3 artifact-testkit/test.py
      - uses: actions/upload-artifact@v7
        with:
          name: opensc-testkit-linux-${{ matrix.arch }}
          path: artifact-testkit/
          if-no-files-found: error
          retention-days: 90

  verify-windows:
    name: Verify Windows ${{ matrix.arch }} on a clean runner
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2025
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: opensc-portable-windows-${{ matrix.arch }}
          path: opensc-package
      - uses: actions/download-artifact@v8
        with:
          name: rutoken-test-windows-${{ matrix.arch }}
          path: rutoken-test
      - name: Download latest matching SoftHSM portable library
        run: |
          Invoke-WebRequest `
            -Uri https://github.com/code-agent-43824/SoftHSMv2/releases/latest/download/softhsm-portable-windows-${{ matrix.arch }}.zip `
            -OutFile softhsm.zip
          Expand-Archive -LiteralPath softhsm.zip -DestinationPath softhsm-package
      - name: Prepare and test downloadable test kit
        run: |
          New-Item -ItemType Directory -Force artifact-testkit\opensc-package, artifact-testkit\softhsm-package, artifact-testkit\rutoken-test | Out-Null
          Copy-Item opensc-package\* artifact-testkit\opensc-package -Recurse
          Copy-Item softhsm-package\* artifact-testkit\softhsm-package -Recurse
          Copy-Item rutoken-test\* artifact-testkit\rutoken-test -Recurse
          Copy-Item scripts\portable\test.py artifact-testkit\test.py
          Copy-Item packaging\portable\TEST-KIT-README.txt artifact-testkit\README.txt
          Set-Content -LiteralPath artifact-testkit\platform.txt -Value 'windows-${{ matrix.arch }}' -NoNewline
          python artifact-testkit\test.py
      - uses: actions/upload-artifact@v7
        with:
          name: opensc-testkit-windows-${{ matrix.arch }}
          path: artifact-testkit/
          if-no-files-found: error
          retention-days: 90

  verify-macos:
    name: Verify macOS universal on a clean runner
    needs: build-macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: opensc-portable-macos-universal
          path: opensc-package
      - uses: actions/download-artifact@v8
        with:
          name: rutoken-test-macos-universal
          path: rutoken-test
      - name: Download latest matching SoftHSM portable library
        run: |
          curl --fail --location --retry 5 \
            --output softhsm.zip \
            https://github.com/code-agent-43824/SoftHSMv2/releases/latest/download/softhsm-portable-macos-universal.zip
          mkdir softhsm-package
          unzip -q softhsm.zip -d softhsm-package
      - name: Prepare and test downloadable test kit
        run: |
          mkdir -p artifact-testkit/opensc-package artifact-testkit/softhsm-package artifact-testkit/rutoken-test
          cp -a opensc-package/. artifact-testkit/opensc-package/
          cp -a softhsm-package/. artifact-testkit/softhsm-package/
          cp -a rutoken-test/. artifact-testkit/rutoken-test/
          cp scripts/portable/test.py artifact-testkit/test.py
          cp packaging/portable/TEST-KIT-README.txt artifact-testkit/README.txt
          printf '%s\n' macos-universal > artifact-testkit/platform.txt
          python3 artifact-testkit/test.py
      - uses: actions/upload-artifact@v7
        with:
          name: opensc-testkit-macos-universal
          path: artifact-testkit/
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish all verified portable packages
    needs: [verify-linux, verify-windows, verify-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: opensc-*
          path: release-input
      - name: Create release archives and checksums
        run: |
          mkdir release-assets
          count=0
          for source in release-input/opensc-*; do
            name=$(basename "$source")
            case "$name" in
              opensc-portable-windows-*) ;;
              opensc-portable-*) chmod +x "$source/bin/pkcs11-tool" ;;
              opensc-testkit-windows-*) ;;
              opensc-testkit-*)
                chmod +x "$source/opensc-package/bin/pkcs11-tool" \
                  "$source/rutoken-test/rutoken-driver"
                ;;
            esac
            (cd "$source" && zip -X -9 -r "$GITHUB_WORKSPACE/release-assets/$name.zip" .)
            count=$((count + 1))
          done
          test "$count" -eq 12
          (cd release-assets && sha256sum *.zip > SHA256SUMS)
      - name: Verify release archive layout
        run: |
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 12
          for archive in release-assets/*.zip; do
            if zipinfo -1 "$archive" | grep -Eq '\.zip$'; then
              echo "nested ZIP found in $archive" >&2
              exit 1
            fi
            case "$(basename "$archive")" in
              opensc-portable-windows-*.zip)
                zipinfo -1 "$archive" | grep -Fx 'bin/pkcs11-tool.exe' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'bin/opensc.dll' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'lib/pkcs11-spy.dll' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'lib/pkcs11-spy.conf' >/dev/null
                ;;
              opensc-portable-macos-*.zip)
                zipinfo -1 "$archive" | grep -Fx 'bin/pkcs11-tool' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'lib/pkcs11-spy.dylib' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'lib/pkcs11-spy.conf' >/dev/null
                ;;
              opensc-portable-linux-*.zip)
                zipinfo -1 "$archive" | grep -Fx 'bin/pkcs11-tool' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'lib/pkcs11-spy.so' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'lib/pkcs11-spy.conf' >/dev/null
                ;;
              opensc-testkit-*.zip)
                zipinfo -1 "$archive" | grep -Fx 'test.py' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'platform.txt' >/dev/null
                zipinfo -1 "$archive" | grep -E '^opensc-package/(bin|lib)/pkcs11-(tool|spy)' >/dev/null
                zipinfo -1 "$archive" | grep -Fx 'opensc-package/lib/pkcs11-spy.conf' >/dev/null
                zipinfo -1 "$archive" | grep -E '^softhsm-package/(libsofthsm2|softhsm2)' >/dev/null
                zipinfo -1 "$archive" | grep -E '^rutoken-test/rutoken-driver(\.exe)?$' >/dev/null
                zipinfo -1 "$archive" | grep -E '^rutoken-test/rutoken-stub\.(so|dylib|dll)$' >/dev/null
                ;;
            esac
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          notes='Portable pkcs11-tool and pkcs11-spy packages plus independently downloadable test kits for Linux x64/ARM64, Windows x86/x64/ARM64, and macOS universal. pkcs11-spy now reads the commented pkcs11-spy.conf template beside its module before environment variables, with safe fallback for absent or invalid files; every clean runner checks both precedence paths. The kit also includes the matching ordinary SoftHSM module and a harmless Rutoken ABI stub. Verification invokes every one of the 33 Rutoken C_EX_* operations through pkcs11-spy, checks the complete 34-field table, logging and redaction, then runs the ordinary direct and spy data-object scenarios.'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "OpenSC portable $RELEASE_TAG" \
              --notes "$notes"
          fi
